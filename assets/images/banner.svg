<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080B11" />
      <stop offset="50%" stop-color="#0F1420" />
      <stop offset="100%" stop-color="#07090E" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#4FACFE" />
      <stop offset="100%" stop-color="#00C6FF" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.16" />
      <stop offset="60%" stop-color="#4FACFE" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#080B11" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FFFFFF" stroke-width="0.5" stroke-opacity="0.04" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg)" />
  <rect width="1200" height="400" fill="url(#glow)" />
  <rect width="1200" height="400" fill="url(#grid)" />

  <!-- Outer frame border -->
  <rect x="20" y="20" width="1160" height="360" rx="16" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.08" />
  
  <!-- Pill Tag -->
  <g transform="translate(60, 60)">
    <rect width="236" height="28" rx="14" fill="#00F2FE" fill-opacity="0.1" stroke="#00F2FE" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="16" cy="14" r="4" fill="#00F2FE" />
    <text x="28" y="18" fill="#00F2FE" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">LOCAL-FIRST RESEARCH</text>
  </g>

  <!-- Title -->
  <text x="60" y="165" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="54" font-weight="800" letter-spacing="-1.5">
    Pulm Notes
  </text>
  
  <!-- Accent Line Under Title -->
  <rect x="60" y="185" width="80" height="4" rx="2" fill="url(#accent)" />

  <!-- Subtitle -->
  <text x="60" y="235" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" letter-spacing="-0.2">
    Local-first, privacy-focused research and personal note-taking desktop and web app.
  </text>

  <!-- Footer Meta -->
  <g transform="translate(60, 310)">
    <rect width="160" height="32" rx="6" fill="#FFFFFF" fill-opacity="0.03" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.08" />
    <text x="14" y="21" fill="#64748B" font-family="'SF Mono', Menlo, Consolas, Monaco, monospace" font-size="12">ORG: LUXION-LABS</text>
  </g>

  <g transform="translate(235, 310)">
    <rect width="170" height="32" rx="6" fill="#FFFFFF" fill-opacity="0.03" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.08" />
    <text x="14" y="21" fill="#64748B" font-family="'SF Mono', Menlo, Consolas, Monaco, monospace" font-size="12">STATUS: PRODUCTION</text>
  </g>

  <g transform="translate(420, 310)">
    <rect width="150" height="32" rx="6" fill="#FFFFFF" fill-opacity="0.03" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.08" />
    <text x="14" y="21" fill="#64748B" font-family="'SF Mono', Menlo, Consolas, Monaco, monospace" font-size="12">LICENSE: MIT</text>
  </g>
</svg>
