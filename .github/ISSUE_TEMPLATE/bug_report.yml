name: Bug Report
description: File an actionable bug report
title: "fix: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thank you for reporting an issue. Please provide details below.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened? What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Exact commands or steps to trigger the bug.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS version, runtime version, browser if applicable.
    validations:
      required: false
